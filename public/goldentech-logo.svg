  <path d="M8 19H10" stroke="url(#gtGoldGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M8 23H10" stroke="url(#gtGoldGrad)" stroke-width="2" stroke-linecap="round" />

  # Right Tower
  <path d="M20 12L27 16V28" stroke="url(#gtMainGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="rgba(100, 116, 139, 0.08)" />

